# ============================================================
# TechNews docker-compose
# 一条命令启动：docker compose up -d
# ============================================================
services:
  technews:
    build: .                      # 用同目录 Dockerfile 构建
    image: technews:latest
    container_name: technews
    ports:
      # 宿主机:容器。若本机 5000 被占用（如 macOS AirPlay 或 WSL 服务），改 "8080:5000"
      - "5000:5000"
    environment:
      - FLASK_DEBUG=0
      - TZ=Asia/Shanghai          # 容器时区，影响爬虫时间显示
      - ADMIN_EMAILS=jiaming1899@qq.com
    volumes:
      # bind mount：直接挂载宿主机现有的 backend/data 目录
      # 迁移 VPS 时：现有 263 篇 SQLite 数据原地复用，零迁移、零丢失
      # 容器内以 uid:gid=1000 运行；若 Linux 上报 Permission denied，
      # 在宿主机执行：sudo chown -R 1000:1000 backend/data
      - ./backend/data:/app/backend/data
    user: "1000:1000"   # 与宿主机数据目录属主对齐（Windows/Mac 本地一般无需关心）
    restart: unless-stopped       # 崩溃/重启 Docker 后自动拉起
    healthcheck:
      # 用 /api/articles 探活（与 render.yaml 的 healthCheckPath 一致）
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/articles', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s           # 给爬虫首次抓取留足时间
