<!DOCTYPE html>

      <div class="user-menu" id="userMenu" style="display:none;">

<!-- 爬虫停摆告警条（看门狗检测到异常时显示） -->
<div class="crawler-alert" id="crawlerAlert" role="alert" aria-live="polite" style="display:none;">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  <span>爬虫可能已停摆：距上次更新已超过 <strong id="crawlerAlertMinutes">--</strong> 分钟</span>
</div>

<!-- 搜索区域 -->
<section class="search-section">
  <div class="search-bar-wrapper">
    <div class="search-input-group">
      <label for="searchInput" class="sr-only">搜索科技资讯、AI 动态、开源项目</label>
      <span class="search-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input type="text" class="search-input" id="searchInput"
             placeholder="搜索科技资讯、AI 动态、开源项目..."
             aria-label="搜索资讯">
    </div>
    <div class="sort-toggle" role="group" aria-label="排序方式">
      <button class="sort-btn active" data-sort="latest" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 最新</button>

    </div>
  </div>
</section>

<!-- 主内容区 -->
<main class="main-content" id="mainContent">
  <!-- 热门推荐 -->
  <section class="hot-section" id="hotSection" aria-label="热门推荐">
    <h2 class="section-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5Z"/></svg> 热门推荐</h2>
    <div class="hot-scroll-wrapper">
      <button class="hot-scroll-btn hot-scroll-prev" aria-label="向左滚动热门推荐" type="button">‹</button>
      <div class="hot-scroll" id="hotScroll">
        <!-- SSR:HOT -->
      </div>
      <button class="hot-scroll-btn hot-scroll-next" aria-label="向右滚动热门推荐" type="button">›</button>
    </div>
  </section>

  <!-- 资讯信息流 -->
  <h2 class="section-title section-title-bar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v16Z"/><path d="M18 14h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2"/><path d="M8 10h6"/><path d="M8 14h6"/><path d="M8 18h4"/></svg> 最新资讯</h2>
  <div class="article-grid" id="articleGrid">
    <!-- SSR:ARTICLES -->
  </div>

  <!-- 分页 -->
  <nav class="pagination" id="pagination" aria-label="分页导航">
    <!-- SSR:PAGINATION -->
  </nav>
</main>

<!-- 页脚 -->
<footer class="footer">
  <p>TechNews 资讯聚合网站 · 数据来源: GitHub / Hacker News / Bilibili / Reddit / 科技博客 · 每 30 分钟自动更新</p>
</footer>
