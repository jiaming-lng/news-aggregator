<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情 - TechNews</title>
  <meta name="description" content="TechNews 文章详情页">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M4 22h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v16Z'/><path d='M18 14h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2'/><path d='M8 10h6'/><path d='M8 14h6'/><path d='M8 18h4'/></svg>">
</head>
<body>

<a href="#mainContent" class="skip-link">跳转到主要内容</a>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo" aria-label="TechNews 首页">
      <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v16Z"/><path d="M18 14h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2"/><path d="M8 10h6"/><path d="M8 14h6"/><path d="M8 18h4"/></svg>
      <span>Tech<span class="logo-accent">News</span></span>
    </a>
    <div class="header-actions">
      <a href="/" class="nav-back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        返回首页
      </a>
      <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换亮色/暗色主题"></button>
      <button class="login-btn" id="loginBtn" title="登录/注册" aria-label="登录或注册">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        登录
      </button>
      <div class="user-menu" id="userMenu" style="display:none;">
        <button class="user-menu-trigger" title="用户菜单" aria-label="用户菜单" aria-haspopup="true" aria-expanded="false">
          <span class="user-avatar" id="userAvatar"></span>
          <span class="user-name" id="userName"></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="user-dropdown">
          <a href="/favorites" class="user-dropdown-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
            我的收藏
          </a>
          <button class="user-dropdown-item" id="logoutBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            退出登录
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="main-content" id="mainContent">
  <div class="article-detail-container">
    <!-- 加载状态 -->
    <div class="loading-indicator" id="loadingIndicator">
      <div class="spinner"></div>
      <div>正在加载文章...</div>
    </div>

    <!-- 文章内容 -->
    <article class="article-detail" id="articleDetail" style="display:none;">
      <div class="detail-header">
        <div class="detail-badges">
          <span class="platform-badge" id="detailPlatform"></span>
          <span class="category-tag" id="detailCategory"></span>
        </div>
        <h1 class="detail-title" id="detailTitle"></h1>
        <div class="detail-meta" id="detailMeta"></div>
      </div>

      <div class="detail-summary" id="detailSummary"></div>

      <div class="detail-actions">
        <a href="#" id="detailSourceLink" target="_blank" rel="noopener" class="btn-external btn-large">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          查看原文
        </a>
        <button class="btn-share" id="btnShare" title="分享文章">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          分享
        </button>
        <button class="btn-share fav-detail-btn" id="btnFavorite" title="收藏文章">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
          <span class="fav-text">收藏</span>
        </button>
      </div>

      <div class="detail-keywords" id="detailKeywords"></div>
    </article>

    <!-- 错误状态 -->
    <div class="error-state" id="errorState" style="display:none;">
      <div class="empty-icon">!</div>
      <div class="error-text">文章不存在或已过期</div>
      <a href="/" class="btn-retry">返回首页</a>
    </div>

    <!-- 相关文章 -->
    <section class="related-section" id="relatedSection" style="display:none;">
      <h2 class="section-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c-2.5-2.5-4-5.5-4-9s1.5-6.5 4-9m0 18c2.5-2.5 4-5.5 4-9s-1.5-6.5-4-9"/></svg>
        相关推荐
      </h2>
      <div class="article-grid" id="relatedGrid"></div>
    </section>
  </div>
</main>

<footer class="footer">
  <p>TechNews 资讯聚合网站 · 数据来源: GitHub / Hacker News / Bilibili / Reddit / 科技博客 · 每 30 分钟自动更新</p>
</footer>

<div class="toast" id="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

<script src="/js/theme.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/article-detail.js"></script>
</body>
</html>
