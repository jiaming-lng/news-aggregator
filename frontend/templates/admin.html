<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.dataset.theme = localStorage.getItem('technews-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - TechNews 资讯聚合</title>
  <meta name="description" content="TechNews 管理后台 - 查看爬取状态、数据统计和平台分布。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/css/style.css?v=7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233377aa' stroke-width='2'><circle cx='12' cy='12' r='9'/><circle cx='12' cy='12' r='3'/><line x1='12' y1='2' x2='12' y2='5'/><line x1='12' y1='19' x2='12' y2='22'/><line x1='2' y1='12' x2='5' y2='12'/><line x1='19' y1='12' x2='22' y2='12'/></svg>">
</head>
<body>

<!-- 跳转到内容 -->
<a href="#adminContent" class="skip-link">跳转到主要内容</a>

<!-- 顶部导航栏 -->
<header class="header">
  <div class="header-inner">
    <a href="/" class="logo" aria-label="TechNews 首页">
      <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2z"/><path d="M7 7h10"/><path d="M7 11h10"/><path d="M7 15h6"/></svg>
      <span>Tech<span class="logo-accent">News</span></span>
    </a>

    <nav class="nav-tabs" aria-label="页面导航">
      <a href="/" class="nav-back-link" aria-label="返回首页">
        ← 返回首页
      </a>
    </nav>

    <div class="header-actions">
      <a href="/admin/blog" class="nav-back-link" title="博客管理" aria-label="博客管理">
        博客管理
      </a>
      <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换亮色/暗色主题"></button>
    </div>
  </div>
</header>

<!-- 管理后台内容 -->
<div class="admin-wrapper" id="adminContent">

  <!-- 标题 -->
  <div class="admin-header">
    <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 8px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> 管理后台</h1>
    <p class="breadcrumb"><a href="/">首页</a> / 管理后台</p>
  </div>

  <!-- 统计卡片 -->
  <div class="stats-grid" id="statsGrid" role="region" aria-label="数据统计概览">
    <div class="stat-card accent">
      <div class="stat-label"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 6px;"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg> 资讯总数</div>
      <div class="stat-value" id="statTotal">-</div>
      <div class="stat-sub">历史累计</div>
    </div>
    <div class="stat-card accent">
      <div class="stat-label"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 6px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> 今日新增</div>
      <div class="stat-value" id="statToday">-</div>
      <div class="stat-sub">今日爬取量</div>
    </div>
    <div class="stat-card accent">
      <div class="stat-label"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 6px;"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> 爬取成功率</div>
      <div class="stat-value" id="statCrawls">-</div>
      <div class="stat-sub">成功/总数</div>
    </div>
    <div class="stat-card accent">
      <div class="stat-label"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 6px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 更新间隔</div>
      <div class="stat-value">30<span style="font-size: 1rem;"> 分钟</span></div>
      <div class="stat-sub">自动定时爬取</div>
    </div>
  </div>

  <!-- 图表区域 -->
  <div class="charts-grid">
    <!-- 分类分布 -->
    <div class="chart-card">
      <h3 class="chart-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 6px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> 资讯分类分布</h3>
      <div id="categoryChart" role="img" aria-label="资讯分类分布图表">
        <p style="color: var(--text-muted);">加载中...</p>
      </div>
    </div>

    <!-- 平台分布 -->
    <div class="chart-card">
      <h3 class="chart-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 6px;"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> 数据来源分布</h3>
      <div id="platformChart" role="img" aria-label="数据来源平台分布图表">
        <p style="color: var(--text-muted);">加载中...</p>
      </div>
    </div>
  </div>

  <!-- 每日新增趋势 -->
  <div class="chart-card" style="margin-bottom: 28px;">
    <h3 class="chart-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 6px;"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg> 近 7 日每日新增趋势</h3>
    <div id="dailyTrend" role="img" aria-label="近7日每日新增趋势折线图">
      <p style="color: var(--text-muted);">加载中...</p>
    </div>
  </div>

  <!-- 控制区 -->
  <div class="control-section">
    <button class="btn-trigger-crawl" id="btnTriggerCrawl" aria-label="手动触发一次爬取">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 6px;"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> 手动触发爬取
    </button>
    <span class="crawl-status" id="crawlStatusMsg" role="status" aria-live="polite"></span>
  </div>

  <!-- 爬取日志表格 -->
  <div class="chart-card" style="margin-bottom: 28px;">
    <h3 class="chart-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 6px;"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> 最近爬取日志</h3>
    <div class="log-table-wrapper">
      <table class="log-table">
        <thead>
          <tr>
            <th scope="col">数据平台</th>
            <th scope="col">状态</th>
            <th scope="col">抓取条数</th>
            <th scope="col">新增条数</th>
            <th scope="col">爬取时间</th>
          </tr>
        </thead>
        <tbody id="logTbody">
          <tr>
            <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 40px;">加载中...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="/js/theme.js?v=14"></script>
<script src="/js/auth.js?v=14"></script>
<script src="/js/admin.js?v=14"></script>
</body>
</html>
