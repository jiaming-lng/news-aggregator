<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的收藏 - TechNews</title>
  <meta name="description" content="TechNews 我的收藏文章列表">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M4 22h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v16Z'/><path d='M18 14h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2'/><path d='M8 10h6'/><path d='M8 14h6'/><path d='M8 18h4'/></svg>">
</head>
<body>

<a href="#mainContent" class="skip-link">跳转到主要内容</a>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo" aria-label="TechNews 首页">
      <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v16Z"/><path d="M18 14h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2"/><path d="M8 10h6"/><path d="M8 14h6"/><path d="M8 18h4"/></svg>
      <span>Tech<span class="logo-accent">News</span></span>
    </a>
    <div class="header-actions">
      <a href="/" class="nav-back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        返回首页
      </a>
      <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换亮色/暗色主题"></button>
      <button class="login-btn" id="loginBtn" title="登录/注册" aria-label="登录或注册">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        登录
      </button>
      <div class="user-menu" id="userMenu" style="display:none;">
        <button class="user-menu-trigger" title="用户菜单" aria-label="用户菜单" aria-haspopup="true" aria-expanded="false">
          <span class="user-avatar" id="userAvatar"></span>
          <span class="user-name" id="userName"></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="user-dropdown">
          <a href="/favorites" class="user-dropdown-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
            我的收藏
          </a>
          <button class="user-dropdown-item" id="logoutBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            退出登录
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="main-content" id="mainContent">
  <h2 class="section-title section-title-bar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
    我的收藏
  </h2>

  <!-- 未登录提示 -->
  <div class="empty-state" id="loginPrompt" style="display:none;">
    <div class="empty-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <p class="empty-text">登录后即可收藏喜欢的文章</p>
    <button class="btn-retry" id="loginPromptBtn">去登录</button>
  </div>

  <!-- 加载状态 -->
  <div class="loading-indicator" id="loadingIndicator">
    <div class="spinner"></div>
    <div>正在加载收藏...</div>
  </div>

  <!-- 收藏列表 -->
  <div class="article-grid" id="favoritesGrid"></div>

  <!-- 空状态 -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
    </div>
    <p class="empty-text">还没有收藏任何文章</p>
    <a href="/" class="btn-retry">去发现好文章</a>
  </div>

  <!-- 分页 -->
  <nav class="pagination" id="pagination" aria-label="分页导航"></nav>
</main>

<footer class="footer">
  <p>TechNews 资讯聚合网站 · 数据来源: GitHub / Hacker News / Bilibili / Reddit / 科技博客 · 每 30 分钟自动更新</p>
</footer>

<div class="toast" id="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

<script src="/js/theme.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/favorites.js"></script>
</body>
</html>
